if(k==="speed")return speed();
T={m:k,n:0,d:0};put(head()+`<h2>Wheel of Fury!</h2><p>Spin to set the category for this round.</p>`+wheel("w2",CATS,1));bind("w2",CATS.length,i=>{T.cat=CATS[i];sfx("fan");msg("Category: "+T.cat,"Every question this turn comes from it.","Pick your rungs",rungs)})}
function rungs(){put(head()+`<div class="card"><h2>How many rungs?</h2><p>More rungs means more risk of the Hungry Monkey.</p>${[1,2,3].map(n=>`<button onclick="pick(${n})">${n} rung${n>1?"s":""} · ${ODDS[n-1]}% monkey</button>`).join("")}</div>`)}
function pick(n){T.n=n;const m=me();if(Math.random()*100<ODDS[n-1]){sfx("chomp");if(blk(m,showQ))return;const x=Math.min(1,m.pts);m.pts-=x;G.pile+=x;return msg("The Hungry Monkey!",`🐒 It strikes! ${esc(m.n)} misses a go${x?" and a present goes back in the pile":""}.`,"Next player",end,"monkey")}showQ()}
function showQ(){T.q=nq(T.cat);const tg=T.m==="back"?`<p><span class="tag">Backwards bonus: an extra present for saying it backwards</span></p>`:"";put(head()+`<div class="card"><p>${T.q[2]} · question ${T.d+1} of ${T.n} · <b>🐢 <span id="tt">10</span></b></p>${tg}<h2>${T.q[0]}</h2></div><button class="alt" onclick="show()">Reveal answer</button>`);turtle(10,()=>miss(1))}
function show(){put(head()+`<div class="card"><h2>${T.q[0]}</h2><p class="ans">${T.q[1]}</p></div><button class="ok" onclick="right()">Correct</button><button class="no" onclick="miss()">Wrong</button>`)}
function adv(n){const m=me(),L=[];let tail=0,mud=0;for(let i=0;i<n&&!tail;i++){if(m.pos>=14)break;m.pos++;if(m.pos===5){mud=1;L.push("🛖 The Mud Hut!");sfx("splash");cf(30)}if(m.pos===10){L.push("🌈 Through the Rainbow Ring! "+pk(gain(2)));sfx("spark");cf(40)}if(m.pos===14){L.push("🐒 The Golden Monkey! "+pk(gain(2)));tail=1}}return{L,tail,mud}}
function mudS(nx){cb=nx;put(head()+`<div class="card"><h2>🛖 Mud Hut!</h2><p>Take an extra present, or steal one from another player.</p></div><button onclick="mx(1)">Extra pick</button>${oth().map(i=>G.p[i].pts>0?`<button onclick="steal(${i},1,cb)">Steal from ${esc(G.p[i].n)}</button>`:"").join("")}`)}
function mx(){msg("Extra pick!",pk(gain(1)),"Continue",cb)}
function right(){sfx("ding");T.bl=pk(gain(1));if(T.m==="back"){const w=T.q[1].split(" "),L=w.length<=2,r=L?T.q[1].split("").reverse().join("").toLowerCase():w.reverse().join(" ");return put(head()+`<div class="card"><h2>Say it backwards!</h2><p>${L?"Letters reversed:":"Word order reversed:"}</p><p class="ans">${r}</p></div><button class="ok" onclick="bonus(1)">Nailed it (extra present)</button><button class="no" onclick="bonus(0)">Missed it</button>`)}after()}
function bonus(p){if(p){sfx("fan");T.bl+="<br>"+pk(gain(1))+" (backwards bonus)"}after()}
function after(){const r=adv(1);T.d++;const m=me(),b=[T.bl||"",`${esc(m.n)} climbs to rung ${m.pos}.`,...r.L].filter(Boolean).join("<br>"),h=m.pos===5?"mud":m.pos===10?"ring":"good",more=T.d<T.n,nx=more?showQ:end;if(r.tail)return msg("Golden Monkey!",b,"Yank his tail!",tail);if(r.mud)return msg("Mud Hut!",b,"Into the Mud Hut",()=>mudS(nx),h);if(G.pile<=0)return msg("Correct!",b,"Finish",fin);msg(more?"Correct!":"Great climb!",b,more?"Next question":"Next player",nx,h)}
function miss(tt){const m=me();if(blk(m,turn))return;let x=0;if(tt&&m.pts>0){x=1;m.pts--;G.pile++}sfx("buzz");msg(tt?"The Time Turtle says time’s up!":"Not quite!",`The answer was <b>${T.q[1]}</b>. ${x?"A present goes back in the pile. ":""}Play passes to ${esc(nxt().n)}.`,"Next player",end,"bad")}
function wango(){const w=draw(N,"n");T={w};put(head()+`<div class="card"><span class="tag">Wicked Wango</span><h2>${w[0]}</h2><p>Is the answer higher or lower than <b>${w[2]}</b>?</p></div><button onclick="hl(1)">Higher</button><button onclick="hl(-1)">Lower</button>`)}
function hl(d){const w=T.w,m=me(),ok=(w[1]>w[2]?1:-1)===d,t=`The answer was <b>${w[1]}</b>.`;if(!ok){if(blk(m,turn))return;sfx("buzz");return msg("Wicked wrong!",`${t} Play passes to ${esc(nxt().n)}.`,"Next player",end,"bad")}sfx("ding");const r=adv(2),b=[t+" "+pk(gain(1))+" Two rungs up.",...r.L].join("<br>");if(r.tail)return msg("Golden Monkey!",b,"Yank his tail!",tail);if(r.mud)return msg("Wicked right!",b,"Into the Mud Hut",()=>mudS(end),"good");msg("Wicked right!",b,"Next player",end,"good")}
function google(){const c=draw(GC,"g"),m=me();sfx("fan");
if(c[0]==="angel"){m.angel=(m.angel||0)+1;return msg(c[1],c[2],"Free turn",turn,"angel")}
if(c[0]==="gimme")return pickT(c[1],c[2],999,end);
if(c[0]==="joey")return pickT(c[1],c[2],2,end);
if(c[0]==="dip")return msg(c[1],pk(gain(1)),"Next player",end);
if(c[0]==="marcel"){if(m.pts<1)return msg(c[1],"You have nothing for Marcel to take!","Next player",end);if(blk(m,end))return;const i=rnd(oth());m.pts--;G.p[i].pts++;sfx("boing");return msg(c[1],`Marcel takes a present from ${esc(m.n)} and gives it to ${esc(G.p[i].n)}.`,"Next player",end)}
if(c[0]==="peel"){if(blk(m,end))return;m.pos=Math.max(0,m.pos-2);const x=Math.min(1,m.pts);m.pts-=x;G.pile+=x;sfx("boing");return msg(c[1],c[2],"Next player",end)}
if(c[0]==="breath")return breathCard(c);T={c};put(head()+`<div class="card pop"><h2>${c[1]}</h2><p>${c[2]}</p>${c[3]?`<p class="n">🐢 <span id="tt">${c[3]}</span></p>`:""}</div><button class="ok" onclick="chal(1)">Nailed it (+1 present)</button><button class="no" onclick="chal(0)">Failed (−1 present)</button>`);if(c[3])turtle(c[3],()=>{sfx("buzz");const e=document.getElementById("tt");if(e)e.textContent="Time!"})}
function ambush(f){const m=me();if(Math.random()<.08){sfx("chomp");if(blk(m,f))return;const x=Math.min(1,m.pts);m.pts-=x;G.pile+=x;return msg("The Hungry Monkey!",`🐒 It leaps out of nowhere! ${esc(m.n)} misses a go${x?" and a present goes back in the pile":""}.`,"Next player",end,"monkey")}f()}
function breathCard(c){let g=5;put(head()+`<div class="card pop"><h2>${c[1]}</h2><p>${c[2]}</p><p class="n" id="tt">${g}</p><p id="bs"><b>Get ready…</b></p></div><button class="ok" onclick="chal(1)">Held it (+1 present)</button><button class="no" onclick="chal(0)">Gasped (−1 present)</button>`);sfx("tick");tm=setInterval(()=>{g--;const e=document.getElementById("tt");if(g>0){if(e)e.textContent=g;sfx("tick");return}clearInterval(tm);sfx("fan");let h=20;if(e)e.textContent=h;const b=document.getElementById("bs");if(b)b.innerHTML="<b>HOLD YOUR BREATH!</b>";tm=setInterval(()=>{h--;const e2=document.getElementById("tt");if(e2)e2.textContent=h>0?h:"Done!";if(h>0&&h<=3)sfx("tick");if(h<=0){clearInterval(tm);sfx("big");const b2=document.getElementById("bs");if(b2)b2.innerHTML="<b>Breathe out!</b>"}},1000)},1000)}
function chal(ok){const m=me();if(ok){sfx("ding");return msg("Nailed it!",pk(gain(1)),"Next player",end)}if(blk(m,end))return;const x=Math.min(1,m.pts);m.pts-=x;G.pile+=x;sfx("buzz");msg("Oh dear!",x?"A present goes back in the pile.":"You had nothing to lose!","Next player",end)}
function speed(){T={m:"speed",d:0,k:0,st:0,L:[],left:15};clearInterval(sTm);sTm=setInterval(()=>{T.left--;const e=document.getElementById("tt");if(e)e.textContent=T.left;if(T.left>0&&T.left<=5)sfx("tick");if(T.left<=0)speedEnd()},1000);sq()}
function sqc(s){return `<div class="card"><span class="tag">Super Speedy Speed Round</span><p>${T.k%2?"Pat your head with your RIGHT hand and rub your tummy with your LEFT!":"Pat your head with your LEFT hand and rub your tummy with your RIGHT!"} <b>🐢 <span id="tt">${T.left}</span></b></p><h2>${T.q[0]}</h2>${s?`<p class="ans">${T.q[1]}</p>`:""}</div>`}
function sq(){T.q=nq("Anything Goes");T.k++;put(head()+sqc(0)+`<button class="alt" onclick="sr()">Reveal answer</button>`)}
function sr(){if(T.left<=0)return;put(head()+sqc(1)+`<button class="ok" onclick="sc(1)">Correct</button><button class="no" onclick="sc(0)">Wrong (ends the round)</button>`)}
function sc(ok){if(T.left<=0)return;if(!ok){sfx("buzz");return speedEnd()}sfx("ding");T.d++;T.st++;const r=adv(1);T.L.push(pk(gain(1)),...r.L);if(r.mud)T.L.push(pk(gain(1))+" (Mud Hut)");if(T.st===3){T.st=0;T.L.push(pk(gain(1))+" (three in a row bonus!)")}if(r.tail){clearInterval(sTm);return msg("Golden Monkey!",T.L.join("<br>"),"Yank his tail!",tail)}sq()}
function speedEnd(){clearInterval(sTm);msg("Round over!",`🐢 ${esc(me().n)} answered ${T.d} correctly.<br>${T.L.join("<br>")}`,"Next player",end)}
function tail(){let taps=0,left=5,on=0;put(head()+`<div class="card"><h2>Yank the tail!</h2><p>Tap 10 times in 5 seconds.</p><p class="n" id="tl">0 / 10</p></div><button class="tailb" id="tb" aria-label="Yank the tail">🐒</button>`);document.getElementById("tb").onclick=()=>{if(!on){on=1;tm=setInterval(()=>{left-=.1;if(left<=0){clearInterval(tm);lose()}},100)}taps++;sfx("squeal");document.getElementById("tl").textContent=taps+" / 10";if(taps>=10){clearInterval(tm);win()}};
function win(){me().pos=15;msg("BOOM! Paradise Pond!","The tail is yanked! "+pk(gain(2)),"Finish",fin,"tail")}
function lose(){me().pos=10;sfx("chomp");msg("He wriggled free!",`${esc(me().n)} is flung back to the Rainbow Ring.`,"Next player",end,"tail")}}
function fin(){sfx("big");cf(120);put(`<h1>Game over!</h1>${head()}<div class="card pop"><h2>🎉 Present time!</h2>${G.p.map((p,i)=>`<p><b>${esc(p.n)}</b>: ${p.pts} present${p.pts===1?"":"s"} · ${i===G.bd?"she can open them now!":"🔒 locked until tomorrow"}</p>`).join("")}<p>${G.pile} left in the pile.</p><p class="host">“${rnd(J.win)}”</p></div><button class="big" onclick="setup()">Play again</button>`)}
G={p:[],bd:0,pile:0};setup();
</script></body></html>
